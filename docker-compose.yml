services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dermalyzer
      POSTGRES_USER: dermalyzer
      POSTGRES_PASSWORD: dermalyzer
    ports:
      - "5432:5432"
    volumes:
      - dermalyzer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dermalyzer -d dermalyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dermalyzer_postgres_data:
